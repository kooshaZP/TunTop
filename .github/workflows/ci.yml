name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, stated rather than inherited. The workflow only ever reads
# the repository; before this it ran with whatever the implicit default was,
# which varies with the organisation's settings.
permissions:
  contents: read

# A superseded PR push cancels the run still in flight. Pushes to main never
# cancel each other - there is no reason to abort a main run part-way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite drives real route, registry and subprocess code. Without a
    # cap, one hung test occupies the runner until the 6-hour default, which
    # is a far more expensive signal than a 20-minute failure.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The suite is pure stdlib and the Windows-only tests gate themselves
        # on os.name == "nt", so Linux CI is a real, fast signal. Windows is
        # also run because a few modules behave differently there.
        os: [ubuntu-latest, windows-latest]
        # 3.12 is the interpreter release.yml BUILDS the shipped exe on, so it
        # is the one that has to be tested; 3.10 is the supported floor.
        # Testing only 3.10 left the interpreter that produces the artifact
        # entirely unverified.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: python -m pip install --upgrade pip ruff bandit

      # Both gates read a COMMITTED config file, and a missing config is
      # SILENT: ruff falls back to its default rule set and bandit to its
      # default skips, neither of which is the gate this repo documents. A run
      # without them is a green light earned by a check that never ran.
      - name: Verify the gate configs are in the checkout
        run: |
          for f in ruff.toml bandit.yaml; do
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing from the checkout - the lint gate would evaluate an unintended rule set"
              exit 1
            fi
          done

      # Ruff honours the per-file ignores in ruff.toml, which document the
      # intentional `import *` re-export shims and the three dead locals left
      # in draw(). The rule set is deliberately narrow (see ruff.toml): it is
      # the set that catches the defect classes that actually reached main
      # before 1.0.48 - undefined names, dead locals, a function call in an
      # argument default, and a closure over a loop variable.
      - name: ruff
        run: ruff check tuntop tests

      # bandit.yaml lists every skipped class with a measured count and a
      # rationale - all of them inherent to a tool that drives netsh and
      # PowerShell and treats cleanup as best-effort. Without -c this step
      # would run with bandit's own defaults and fail on all ~157 of them.
      # Everything not listed in bandit.yaml stays enabled.
      - name: bandit
        run: bandit -q -c bandit.yaml -r tuntop
