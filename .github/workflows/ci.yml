name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax-check all Python entry points
        run: |
          python -m py_compile tuntop/ui/dashboard.py tuntop/tunnel/helper.py tuntop/network/routing.py tuntop/network/dns.py tuntop/geo/geoip.py tuntop/core/state.py tuntop/core/recovery.py tuntop/core/routes_txn.py tuntop/core/startup_recovery.py tuntop/core/integrity.py tuntop/ui/themes.py tuntop/config/profiles.py tuntop/core/events.py tuntop/monitor/health.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
