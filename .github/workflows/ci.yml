name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax-check all Python entry points
        run: |
          python -m py_compile tunmood/dashboard.py tunmood/helper.py tunmood/routing.py tunmood/netdns.py tunmood/geoip.py

      - name: Offline logic suite (bypass resolve)
        run: python test_bypass_resolve.py
