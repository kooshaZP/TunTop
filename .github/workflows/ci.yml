name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax-check all Python entry points
        run: |
          python -m py_compile tuntop/dashboard.py tuntop/helper.py tuntop/routing.py tuntop/netdns.py tuntop/geoip.py tuntop/state.py tuntop/recovery.py tuntop/routes_txn.py tuntop/startup_recovery.py tuntop/integrity.py tuntop/ui_text.py tuntop/profiles.py tuntop/structured_log.py tuntop/health_report.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
