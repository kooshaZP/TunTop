name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege, stated rather than inherited. The workflow only ever reads
# the repository; before this it ran with whatever the implicit default was,
# which varies with the organisation's settings.
permissions:
  contents: read

# A superseded PR push cancels the run still in flight. Pushes to main never
# cancel each other - there is no reason to abort a main run part-way.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite drives real route, registry and subprocess code. Without a
    # cap, one hung test occupies the runner until the 6-hour default, which
    # is a far more expensive signal than a 20-minute failure.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The suite is pure stdlib and the Windows-only tests gate themselves
        # on os.name == "nt", so Linux CI is a real, fast signal. Windows is
        # also run because a few modules behave differently there.
        os: [ubuntu-latest, windows-latest]
        # 3.12 is the interpreter release.yml BUILDS the shipped exe on, so it
        # is the one that has to be tested; 3.10 is the supported floor.
        # Testing only 3.10 left the interpreter that produces the artifact
        # entirely unverified.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

  lint:
    name: Lint & security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install linters
        run: python -m pip install --upgrade pip ruff bandit

      # Ruff honours the per-file ignores in ruff.toml, which document the
      # intentional `import *` re-export shims and the three dead locals left
      # in draw(). The rule set is deliberately narrow (see ruff.toml): it is
      # the set that catches the defect classes that actually reached main
      # before 1.0.48 - undefined names, dead locals, a function call in an
      # argument default, and a closure over a loop variable.
      - name: ruff
        run: ruff check tuntop tests

      # B104 ("hardcoded_bind_all_interfaces") fires on every "0.0.0.0" route
      # prefix in this codebase, which is the whole point of the tool - a
      # default route is what we install. Everything else in bandit stays
      # enabled on purpose.
      - name: bandit
        run: bandit -q -r tuntop --skip B104
