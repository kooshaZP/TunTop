name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Releases are never cancelled. Two runs for the same tag must not race to
# publish the same assets, and cancelling mid-upload can leave a half-written
# release behind - worse than waiting for the first run to finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # A PyInstaller build plus a full test run, neither of which should ever
    # take this long. A stall (AV scan, wedged tool cache) should fail the
    # job rather than hold a windows runner until the 6-hour default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # The trigger is any v* tag, but the version stamped into the artifacts
      # comes from tuntop/__init__.py and the exe resource block from
      # tuntop_version_info.txt. Tagging v1.0.49 from a tree still at 1.0.48
      # would publish a release page labelled 1.0.49 whose exe,
      # checksums.txt and dashboard all say 1.0.48 - and the in-app update
      # checker would then offer users a "downgrade". Check before anything
      # is built or published.
      - name: Verify the tag matches __version__
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $init = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tuntop\__init__.py')
          $line = ($init -split '\r?\n' | Where-Object { $_ -match '^\s*__version__\s*=' } | Select-Object -First 1)
          if (-not $line) { throw "no __version__ assignment found in tuntop\__init__.py" }
          $version = ($line -split '=')[1].Trim().Trim('"', "'")
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tag -ne $version) {
            throw ("tag '{0}' does not match tuntop __version__ '{1}' - retag as v{1}, or set __version__ = '{0}' and re-tag" -f $env:GITHUB_REF_NAME, $version)
          }
          Write-Output "tag $($env:GITHUB_REF_NAME) matches __version__ $version"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Fetch vendored binaries (tun2socks + wintun)
        run: |
          # The binaries are gitignored, so a fresh checkout has none - the
          # exe would build with none embedded and refuse to start ("NOT
          # FOUND at ..._MEI..."). Same sources Run_Helper.ps1 uses.
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'tuntop-bin'
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $t2 = Invoke-WebRequest -Uri 'https://github.com/xjasonlyu/tun2socks/releases/download/v2.7.0/tun2socks-windows-amd64-v3.zip' -OutFile (Join-Path $tmp 't2.zip') -UseBasicParsing
          Expand-Archive -LiteralPath (Join-Path $tmp 't2.zip') -DestinationPath (Join-Path $tmp 't2') -Force
          $t2exe = Get-ChildItem (Join-Path $tmp 't2') -Recurse -Filter 'tun2socks*.exe' | Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $t2exe (Join-Path $env:GITHUB_WORKSPACE 'tun2socks-windows-amd64-v3.exe') -Force
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile (Join-Path $tmp 'wt.zip') -UseBasicParsing
          Expand-Archive -LiteralPath (Join-Path $tmp 'wt.zip') -DestinationPath (Join-Path $tmp 'wt') -Force
          Copy-Item (Join-Path $tmp 'wt\wintun\bin\amd64\wintun.dll') (Join-Path $env:GITHUB_WORKSPACE 'wintun.dll') -Force
          Get-ChildItem $env:GITHUB_WORKSPACE -Filter 'tun2socks*' | Select-Object Name, Length
          Get-Item (Join-Path $env:GITHUB_WORKSPACE 'wintun.dll') | Select-Object Name, Length

      - name: Build standalone executable
        run: |
          # PyInstaller is pinned to an exact version. Unpinned, the build
          # resolved whatever happened to be newest on release day, so
          # rebuilding the same tag later produced a byte-different exe and a
          # checksums.txt that no longer matched the published asset.
          # 6.22.3 verified against the PyPI JSON API: a py3-none-win_amd64
          # wheel exists and requires-python is >=3.8,<3.16, so 3.12 is fine.
          # `python` is the right invocation here, not `py`: setup-python put
          # the selected 3.12 on PATH, whereas `py` is the system launcher and
          # would resolve a different interpreter.
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.22.3
          python -c "import PyInstaller; print('PyInstaller', PyInstaller.__version__)"
          python -c "import sys; print('interpreter', sys.version)"
          python build_release.py --with-exe

      # build_release.py already exits non-zero when --with-exe produced no
      # exe, so the step above would have failed the job first. This is the
      # second line of defence: it turns "a release went out with a missing
      # asset" into a named, readable failure instead of whatever opaque
      # error the publishing action raises for a missing file.
      #
      # The standalone asset is the ONEDIR build (dist\TunTop\ since 1.0.51),
      # published as a zip, and its name carries the version, so it is
      # resolved by glob rather than hardcoded. Checking for the old
      # dist\TunTop.exe here instead would have let a release publish with the
      # onedir tree but no downloadable archive for it.
      - name: Verify the published artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $init = Get-Content -Raw -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'tuntop\__init__.py')
          $line = ($init -split '\r?\n' | Where-Object { $_ -match '^\s*__version__\s*=' } | Select-Object -First 1)
          $version = ($line -split '=')[1].Trim().Trim('"', "'")
          $standalone = Join-Path $env:GITHUB_WORKSPACE "dist\TunTop-$version-x64-standalone.zip"
          $expected = @(
            'dist\TunTop-x64.zip',
            'dist\checksums.txt',
            'dist\TunTop\TunTop.exe',
            $standalone
          )
          $missing = @()
          foreach ($f in $expected) {
            $p = if ([System.IO.Path]::IsPathRooted($f)) { $f } else { Join-Path $env:GITHUB_WORKSPACE $f }
            if (Test-Path -LiteralPath $p) {
              $item = Get-Item -LiteralPath $p
              Write-Output ("{0} - {1} bytes" -f $f, $item.Length)
            } else {
              $missing += $f
            }
          }
          if ($missing.Count -gt 0) {
            throw ("build produced no {0} - refusing to publish an incomplete release" -f ($missing -join ', '))
          }

      - name: Create GitHub Release
        # Pinned to the commit refs/tags/v2 resolves to, verified through the
        # GitHub API: release 2.6.2, signed by the maintainer, with its tree
        # at f052065072d7e8e0811ea19967e868938377d1da.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # The self-extracting onefile exe is no longer published: it is what
          # Defender's ML model quarantines (TunTop.spec documents onefile as
          # the single most false-positive-prone PyInstaller layout, and a
          # local 1.0.50 build was eaten mid-session as Trojan:Win32/Bearfoos.
          # A!ml with four child processes flagged). dist/TunTop/TunTop.exe
          # inside the standalone zip is the same application with no
          # temp-dir self-extraction, and needs no AV exclusion to install.
          # The glob covers the version in the archive name.
          # WHAT IS PUBLISHED
          # The two zips and checksums.txt - and deliberately NOT the bare
          # dist/TunTop/TunTop.exe.
          #
          # It used to be uploaded, and it cannot run. Since 1.0.51 the shipped
          # layout is onedir: TunTop.exe is a 2.8 MB launcher whose interpreter,
          # DLLs and the vendored binaries live in the sibling `_internal/`
          # (34 MB across 63 files). Verified on the published v1.0.51 asset:
          # downloaded alone it dies instantly with "Failed to load Python DLL
          # '.../_internal/python312.dll'". So the page offered a download that
          # could not start, and `config.updates` fetched that same file by name
          # - which is the only reason a broken artifact stayed in the set.
          #
          # The self-extracting onefile exe is NOT restored here to get a
          # single-file download back: TunTop.spec documents it as the most
          # AV-false-positive-prone PyInstaller layout (a local 1.0.50 build was
          # quarantined as Trojan:Win32/Bearfoos.A!ml with four child processes
          # flagged), and its temp-dir self-extraction is the behaviour ML
          # detectors key on. The standalone zip is the same application with no
          # self-extraction, needs no AV exclusion, and does run on its own.
          files: |
            dist/TunTop-x64.zip
            dist/TunTop-*-x64-standalone.zip
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
